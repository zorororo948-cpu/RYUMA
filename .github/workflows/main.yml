name: Build Ryumax

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework UIKit \
            -framework Foundation \
            Ryumax.m \
            -o Ryumax.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: Ryumax
          path: Ryumax.dylib
